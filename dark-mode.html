<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark Mode Toggle (localStorage)</title>
    <style>
      :root {
        --bg: #fafafa;
        --text: #111;
        --card: #fff;
        --border: rgba(0, 0, 0, 0.15);
      }

      body.dark {
        --bg: #121212;
        --text: #f5f5f5;
        --card: #1c1c1c;
        --border: rgba(255, 255, 255, 0.15);
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem 1rem;
      }

      .card {
        width: min(520px, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 1.5rem;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin-top: 0;
      }

      .hint {
        margin: 0.75rem 0 1.25rem;
        opacity: 0.8;
        line-height: 1.5;
      }

      button {
        padding: 0.75rem 1.2rem;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: transparent;
        color: inherit;
        cursor: pointer;
        font-size: 1rem;
      }

      button:hover {
        filter: brightness(1.05);
      }

      button:active {
        filter: brightness(0.92);
      }

      .link {
        margin-top: 1.5rem;
        font-size: 0.9rem;
        opacity: 0.8;
      }

      .link a {
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid currentColor;
      }

      .link a:hover {
        opacity: 0.95;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Dark Mode Toggle</h1>
      <p class="hint">
        Click the button to toggle dark mode. The setting is saved to
        <code>localStorage</code> so it stays the same after refreshing.
      </p>
      <button id="toggle">Toggle dark mode</button>
      <p class="link">
        <a href="sticky-notes.html">Go to Sticky Notes app →</a>
      </p>
    </div>

    <script>
      const KEY = "day6_darkMode";
      const body = document.body;
      const toggle = document.getElementById("toggle");

      function applyMode(mode) {
        const isDark = mode === "dark";
        body.classList.toggle("dark", isDark);
        toggle.textContent = isDark ? "Switch to light mode" : "Switch to dark mode";
      }

      function persistMode(mode) {
        localStorage.setItem(KEY, mode);
      }

      toggle.addEventListener("click", () => {
        const current = localStorage.getItem(KEY) || "light";
        const next = current === "dark" ? "light" : "dark";
        persistMode(next);
        applyMode(next);
      });

      // Initialize from localStorage on page load
      applyMode(localStorage.getItem(KEY) || "light");
    </script>
  </body>
</html>
