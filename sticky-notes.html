<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky Notes (localStorage)</title>
    <style>
      :root {
        --bg: #f0f4ff;
        --text: #0f172a;
        --card: #fff;
        --border: rgba(15, 23, 42, 0.15);
        --shadow: rgba(15, 23, 42, 0.08);
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem 1rem;
      }

      .card {
        width: min(760px, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 1.5rem;
        box-shadow: 0 18px 46px var(--shadow);
      }

      h1 {
        margin-top: 0;
      }

      .hint {
        margin: 0.75rem 0 1.25rem;
        opacity: 0.8;
        line-height: 1.5;
      }

      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }

      button {
        padding: 0.65rem 1.1rem;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: transparent;
        cursor: pointer;
        color: inherit;
        font-size: 1rem;
      }

      button:hover {
        filter: brightness(1.05);
      }

      button.primary {
        background: #1d4ed8;
        color: white;
        border-color: rgba(29, 78, 216, 0.8);
      }

      .note-list {
        margin-top: 1rem;
        display: grid;
        gap: 1rem;
      }

      .note {
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 1rem;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
      }

      .note textarea {
        width: 100%;
        min-height: 100px;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.75rem;
        resize: vertical;
        font: inherit;
        color: inherit;
        background: transparent;
      }

      .note .meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 0.75rem;
        gap: 1rem;
        font-size: 0.85rem;
        opacity: 0.75;
      }

      .note .delete {
        color: #dc2626;
      }

      .note .delete:hover {
        text-decoration: underline;
      }

      .link {
        margin-top: 1.5rem;
        font-size: 0.9rem;
        opacity: 0.8;
      }

      .link a {
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid currentColor;
      }

      .link a:hover {
        opacity: 0.95;
      }

      @media (min-width: 840px) {
        .rows {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 1.25rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Sticky Notes</h1>
      <p class="hint">
        Type a note and it will automatically save. Notes are stored in <code>localStorage</code> so they remain after refreshing.
      </p>

      <div class="row">
        <div class="row" style="gap: 0.5rem;">
          <button id="newNote" class="primary" type="button">+ New note</button>
          <button id="clearAll" type="button">Clear all</button>
        </div>
        <div class="link">
          <a href="dark-mode.html">Go to Dark Mode app →</a>
        </div>
      </div>

      <div id="noteList" class="note-list" aria-live="polite"></div>
    </div>

    <script>
      const STORAGE_KEY = "day6_stickyNotes";
      const noteList = document.getElementById("noteList");
      const newNoteBtn = document.getElementById("newNote");
      const clearAllBtn = document.getElementById("clearAll");

      function getNotes() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : [];
        } catch (error) {
          console.warn("Failed to load notes", error);
          return [];
        }
      }

      function setNotes(notes) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
      }

      function formatDate(ts) {
        return new Date(ts).toLocaleString(undefined, {
          dateStyle: "medium",
          timeStyle: "short",
        });
      }

      function renderNotes() {
        const notes = getNotes();
        noteList.innerHTML = "";

        if (notes.length === 0) {
          noteList.innerHTML = "<p style='opacity:0.7;'>No notes yet. Click “New note” to start.</p>";
          return;
        }

        notes.forEach((note) => {
          const card = document.createElement("article");
          card.className = "note";

          const textarea = document.createElement("textarea");
          textarea.value = note.text;
          textarea.setAttribute("aria-label", "Note text");

          const meta = document.createElement("div");
          meta.className = "meta";

          const time = document.createElement("span");
          time.textContent = `Updated: ${formatDate(note.updatedAt)}`;

          const deleteBtn = document.createElement("button");
          deleteBtn.type = "button";
          deleteBtn.className = "delete";
          deleteBtn.textContent = "Delete";

          deleteBtn.addEventListener("click", () => {
            const remaining = notes.filter((n) => n.id !== note.id);
            setNotes(remaining);
            renderNotes();
          });

          meta.append(time, deleteBtn);
          card.append(textarea, meta);
          noteList.append(card);

          let debounce;
          textarea.addEventListener("input", () => {
            window.clearTimeout(debounce);
            debounce = window.setTimeout(() => {
              note.text = textarea.value;
              note.updatedAt = Date.now();
              setNotes(notes);
              renderNotes();
            }, 400);
          });
        });
      }

      function createNote() {
        const notes = getNotes();
        const now = Date.now();
        const note = {
          id: `${now}-${Math.random().toString(16).slice(2)}`,
          text: "",
          createdAt: now,
          updatedAt: now,
        };
        notes.unshift(note);
        setNotes(notes);
        renderNotes();

        window.requestAnimationFrame(() => {
          const firstTextarea = noteList.querySelector("textarea");
          if (firstTextarea) firstTextarea.focus();
        });
      }

      function clearAllNotes() {
        if (!confirm("Clear all notes? This cannot be undone.")) return;
        localStorage.removeItem(STORAGE_KEY);
        renderNotes();
      }

      newNoteBtn.addEventListener("click", createNote);
      clearAllBtn.addEventListener("click", clearAllNotes);

      renderNotes();
    </script>
  </body>
</html>
