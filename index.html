<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevNews Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="navbar">
            <div class="logo">
                <span class="logo-icon">📰</span>
                <h1>DevNews</h1>
            </div>
            <form id="search-form" class="search-bar">
                <input type="text" id="search-input" placeholder="Search topics (e.g., React, AI)..." autocomplete="off">
                <button type="submit" class="search-btn">Search</button>
            </form>
        </header>

        <nav class="topic-filters">
            <button class="topic-btn active" data-topic="technology">Technology</button>
            <button class="topic-btn" data-topic="startup">Startup</button>
            <button class="topic-btn" data-topic="science">Science</button>
            <button class="topic-btn" data-topic="javascript">JavaScript</button>
            <button class="topic-btn" data-topic="ai">AI</button>
        </nav>

        <main class="main-content">
            <div id="status-container" class="status-container">
                <div class="loader"></div>
                <p id="status-text">Curating the latest news...</p>
            </div>
            
            <div id="news-grid" class="news-grid hidden">
                <!-- News cards will be injected here -->
            </div>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
